<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8"/>
  <link href="/vite.svg" rel="icon" type="image/svg+xml"/>
  <link href="./../../output.css" rel="stylesheet">
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Irish Property Sales</title>
  <script src="irishPropertySalesMain.ts" type="module"></script>
  <script src="irishPropertySalesMap.ts" type="module"></script>
  <script src="irishPropertySalesChart2.ts" type="module"></script>
  <script src="irishPropertySalesChart3.ts" type="module"></script>
  <script src="irishPropertySalesChart4.ts" type="module"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
<header class="bg-slate-900 border-b border-slate-800 py-2">
  <h1 class="text-xl md:text-2xl font-bold text-center text-slate-100">
    Irish Property Sales Dashboard
  </h1>
</header>
<main class="p-4 pb-32">
  <section class="grid grid-cols-1 md:grid-cols-2 grid-rows-4 md:grid-rows-2 gap-4 auto-rows-auto"
           id="dashboard">
    <div class="bg-slate-900 rounded-lg p-4 shadow-lg h-140">
      <section class="w-full h-full" id="map"></section>
    </div>
    <div class="bg-slate-900 rounded-lg p-4 shadow-lg h-140">
      <section class="w-full h-full" id="chart2"></section>
    </div>
    <div class="bg-slate-900 rounded-lg p-4 shadow-lg h-100 ">
      <section class="w-full h-full" id="chart3"></section>
    </div>
    <div class="bg-slate-900 rounded-lg p-4 shadow-lg h-100">
      <section class="w-full h-full" id="chart4"></section>
    </div>
  </section>
</main>
<div class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50">
  <div
      class="bg-slate-900 rounded-full shadow-2xl px-8 py-4 flex items-center gap-4 border border-slate-700 opacity-30 hover:opacity-100 transition-opacity duration-300">

    <button
        class="bg-blue-500 hover:bg-blue-600 text-white rounded-full w-10 h-10 flex items-center justify-center transition-colors duration-200"
        id="play-pause-btn"
    >
      <svg class="w-5 h-5" fill="currentColor" id="play-icon" viewBox="0 0 24 24">
        <path d="M8 5v14l11-7z"/>
      </svg>
      <svg class="w-5 h-5 hidden" fill="currentColor" id="pause-icon" viewBox="0 0 24 24">
        <path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/>
      </svg>
    </button>
    <p class="text-lg font-semibold text-slate-200 whitespace-nowrap" id="year-display">
      Year: 2010
    </p>
    <input
        class="w-64 h-2 bg-slate-700 rounded-lg appearance-auto cursor-pointer accent-blue-500"
        id="year-slider"
        max="2025"
        min="2010"
        step="1"
        type="range"
        value="2010"
    >

  </div>
</div>
</body>
</html>
